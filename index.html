<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132a27">
  <meta name="description" content="Програма English Tutor: дні навчання й особисті результати.">
  <title>English Tutor · програма</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="header-link" href="./daily_task_app/day30/index.html">До сьогоднішніх задач <span aria-hidden="true">↗</span></a>
    </header>

    <main>
      <section class="route-status" aria-label="Прогрес навчання">
        <div class="route-track" role="progressbar" aria-label="Завершені дні" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0"><span id="progress-fill"></span></div>
      </section>

      <section class="days-section" id="days" aria-labelledby="days-title">
        <div class="day-list" id="day-list" aria-label="Дні навчальної програми"></div>
      </section>
    </main>

  </div>

  <dialog class="day-dialog" id="day-dialog" aria-labelledby="detail-title">
    <div class="dialog-inner">
      <div class="dialog-top"><span class="dialog-label" id="detail-day"></span><button class="close-button" id="close-dialog" type="button" aria-label="Закрити деталі">×</button></div>
      <h2 id="detail-title"></h2>
      <p class="detail-translation" id="detail-translation"></p>
      <div class="detail-grid" id="detail-grid">
        <div class="detail-block"><span>КОНТРОЛЬНЕ ПИТАННЯ</span><p id="detail-question"></p></div>
        <div class="detail-block"><span>МОВНИЙ ФОКУС</span><p id="detail-focus"></p></div>
        <div class="detail-block"><span>ЗАВДАННЯ ДНЯ</span><p id="detail-artifact"></p></div>
        <div class="detail-block"><span>ОЧІКУВАНИЙ РЕЗУЛЬТАТ</span><p id="detail-evidence"></p></div>
      </div>
      <p class="detail-note" id="detail-note"></p>
      <div class="dialog-actions" id="dialog-actions"></div>
    </div>
  </dialog>
  <script src="./data.js"></script>
  <script src="./progress.js"></script>
  <script src="./app.js"></script>
</body>
</html>
